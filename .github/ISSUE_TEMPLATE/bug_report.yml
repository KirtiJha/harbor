name: Bug report
description: Something in Porthaven does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this. Please do not paste secrets, tokens or private paths.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a Vite server on 5173
        2. Click "Stop whole app"
        3. ...
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Windows]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `porthaven --version` and `python3 --version`
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output or screenshots
      description: The terminal output of `porthaven`, or a screenshot.
      render: shell
