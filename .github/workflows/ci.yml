name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install lsof (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lsof
      - name: Unit and integration tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v
      - name: What the OS reports (diagnostics)
        if: always()
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) netstat -ano | head -20 ;;
            Linux) head -20 /proc/net/tcp ;;
            *) lsof -nP -iTCP -sTCP:LISTEN | head -20 || true
               /usr/libexec/ApplicationFirewall/socketfilterfw --getglobalstate --getstealthmode || true
               sysctl net.inet.tcp.blackhole || true
               python -m http.server 47999 --bind 127.0.0.1 >/dev/null 2>&1 & sleep 2
               curl -sS -m 5 -o /dev/null -w "plain http.server on 127.0.0.1: %{http_code}\n" http://127.0.0.1:47999/ || true
               kill %1 || true ;;
          esac
      - name: CLI smoke test
        if: always()
        env:
          PYTHONPATH: .
        run: |
          python -m porthaven --version
          python -m porthaven ls --all
          python -m porthaven free 3000 -n 3

  web:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type check and build
        run: npm run build
